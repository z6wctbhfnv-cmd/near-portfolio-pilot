[package]
name = "pilot-strategies"
version = "0.1.0"
edition = "2021"
description = "Deterministic portfolio strategies for NEAR Portfolio Pilot. WASI module: JSON in on stdin, one JSON value out on stdout (OutLayer convention)."
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pilot-strategies"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
